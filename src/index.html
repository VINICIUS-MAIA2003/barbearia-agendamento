<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Clássica - Agendamento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border-top: 4px solid #d4af37;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: #d4af37;
            font-size: 28px;
            margin-bottom: 5px;
        }
        header p {
            color: #aaaaaa;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cccccc;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 15px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #d4af37;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #d4af37;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #b5952f;
        }
        .mensagem-sucesso {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #1b4332;
            color: #d8f3dc;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Barbearia Clássica</h1>
        <p>Agende seu horário com facilidade</p>
    </header>

    <form id="formAgendamento">
        <div class="form-group">
            <label for="nome">Seu Nome</label>
            <input type="text" id="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="form-group">
            <label for="servico">Serviço</label>
            <select id="servico" required>
                <option value="" disabled selected>Escolha um serviço</option>
                <option value="Corte de Cabelo - R$ 40">Corte de Cabelo - R$ 40</option>
                <option value="Barba Completa - R$ 30">Barba Completa - R$ 30</option>
                <option value="Combo (Cabelo + Barba) - R$ 60">Combo (Cabelo + Barba) - R$ 60</option>
                <option value="Sobrancelha - R$ 15">Sobrancelha - R$ 15</option>
            </select>
        </div>

        <div class="form-group">
            <label for="barbeiro">Profissional</label>
            <select id="barbeiro" required>
                <option value="Qualquer barbeiro">Sem preferência</option>
                <option value="Carlos">Carlos</option>
                <option value="Marcos">Marcos</option>
            </select>
        </div>

        <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" required>
        </div>

        <div class="form-group">
            <label for="horario">Horário</label>
            <select id="horario" required>
                <option value="" disabled selected>Selecione o horário</option>
                <option value="09:00">09:00</option>
                <option value="10:00">10:00</option>
                <option value="11:00">11:00</option>
                <option value="14:00">14:00</option>
                <option value="15:00">15:00</option>
                <option value="16:00">16:00</option>
                <option value="17:00">17:00</option>
                <option value="18:00">18:00</option>
            </select>
        </div>

        <button type="submit">Confirmar Agendamento</button>
    </form>

    <div class="mensagem-sucesso" id="mensagemSucesso"></div>
</div>

<script>
    const inputData = document.getElementById('data');
    const hoje = new Date().toISOString().split('T')[0];
    inputData.setAttribute('min', hoje);

    document.getElementById('formAgendamento').addEventListener('submit', function(event) {
        event.preventDefault();

        const nome = document.getElementById('nome').value;
        const servico = document.getElementById('servico').value;
        const barbeiro = document.getElementById('barbeiro').value;
        const data = document.getElementById('data').value;
        const horario = document.getElementById('horario').value;

        const dataFormatada = data.split('-').reverse().join('/');

        const msgDiv = document.getElementById('mensagemSucesso');
        msgDiv.style.display = 'block';
        msgDiv.innerHTML = `<strong>Agendamento registrado!</strong><br>
                            Olá, ${nome}. Seu horário para <b>${servico}</b> com <b>${barbeiro}</b> 
                            está pré-agendado para o dia <b>${dataFormatada}</b> às <b>${horario}</b>.`;
    });
</script>

</body>
</html>
